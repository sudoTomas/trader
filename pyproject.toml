[project]
name = "trader"
version = "0.1.0"
description = "Agentic-first autonomous trading agent — LLM proposes, RiskGuard disposes, Alpaca executes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tomas McMonigal", email = "tmcmonigal@protonmail.com" }]
requires-python = ">=3.12"
keywords = ["trading", "paper-trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "structlog>=24.4",
    "typer>=0.27.2",
    "mcp>=1.2",
    "numpy>=2.1",
    "cryptography>=43",
]

[project.scripts]
trader = "trader.surfaces.cli.main:app"

[project.urls]
Homepage = "https://github.com/sudoTomas/trader"
Repository = "https://github.com/sudoTomas/trader"
Issues = "https://github.com/sudoTomas/trader/issues"
Changelog = "https://github.com/sudoTomas/trader/releases"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
